<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Дисциплина v2 | Личный кабинет</title>
    <meta
      name="description"
      content="Доменная оболочка для личного кабинета Дисциплина v2 поверх Google Apps Script."
    >
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
    <link rel="shortcut icon" type="image/png" href="./favicon-32.png">
    <style>
      :root {
        --bg: #0b1120;
        --panel: rgba(15, 23, 42, 0.82);
        --line: rgba(148, 163, 184, 0.22);
        --text: #e5eef8;
        --card: #ffffff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 Arial, sans-serif;
      }

      body {
        min-width: 320px;
      }

      .layout {
        min-height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto;
      }

      .hero {
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }

      .card {
        width: min(380px, 100%);
        background: var(--card);
        color: #0f172a;
        border-radius: 18px;
        padding: 24px 20px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.28);
      }

      .status {
        margin: 0 0 10px;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.3;
      }

      .hint {
        margin: 0;
        font-size: 14px;
        color: #64748b;
      }

      .hint a {
        color: #2563eb;
        text-decoration: none;
      }

      .footer {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        backdrop-filter: blur(10px);
      }

      .footer a {
        font-size: 13px;
        text-decoration: none;
        color: #bfdbfe;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <main class="hero">
        <section class="card">
          <p class="status" id="status-text">Открываем кабинет...</p>
          <p class="hint">
            Если не открылось,
            <a id="open-portal-link" href="#">нажмите сюда</a>.
          </p>
        </section>
      </main>

      <footer class="footer">
        <a href="guide.html">Инструкция</a>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms-of-service.html">Terms of Service</a>
      </footer>
    </div>

    <script>
      (function () {
        var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwUQQ4XtYyajt6VFcldRTzCmU3PcFlVtQUdBQoJR3SafewHXyZ0XKkaFlk7HZsDia929Q/exec';
        var openPortalLink = document.getElementById('open-portal-link');
        var statusText = document.getElementById('status-text');
        var wrapperUrl = new URL(window.location.href);
        var appUrl = new URL(EXEC_URL);

        if (wrapperUrl.search) {
          appUrl.search = wrapperUrl.search;
        }

        if (openPortalLink) {
          openPortalLink.href = appUrl.toString();
        }

        if (statusText) {
          statusText.textContent = 'Открываем кабинет...';
        }

        if (wrapperUrl.searchParams.has('login_token')) {
          wrapperUrl.searchParams.delete('login_token');
          var nextUrl =
            wrapperUrl.pathname +
            (wrapperUrl.search ? wrapperUrl.search : '') +
            (wrapperUrl.hash ? wrapperUrl.hash : '');
          window.history.replaceState(null, '', nextUrl);
        }

        window.location.replace(appUrl.toString());
      })();
    </script>
  </body>
</html>
