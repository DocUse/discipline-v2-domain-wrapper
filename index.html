<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Дисциплина v2 | Личный кабинет</title>
    <meta
      name="description"
      content="Доменная оболочка для личного кабинета Дисциплина v2 поверх Google Apps Script."
    >
    <style>
      :root {
        --bg: #0b1120;
        --panel: rgba(15, 23, 42, 0.82);
        --line: rgba(148, 163, 184, 0.22);
        --text: #e5eef8;
        --card: #ffffff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 Arial, sans-serif;
      }

      body {
        min-width: 320px;
      }

      .layout {
        min-height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto;
      }

      .frame-shell {
        min-height: 0;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        min-height: calc(100vh - 56px);
        border: 0;
        background: var(--card);
      }

      .footer {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        backdrop-filter: blur(10px);
      }

      .footer a {
        font-size: 13px;
        text-decoration: none;
        color: #bfdbfe;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <main class="frame-shell">
        <iframe
          id="portal-frame"
          title="Личный кабинет рекрутера"
          loading="eager"
          referrerpolicy="no-referrer-when-downgrade"
          allow="clipboard-write"
        ></iframe>
      </main>

      <footer class="footer">
        <a href="guide.html">Инструкция</a>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms-of-service.html">Terms of Service</a>
      </footer>
    </div>

    <script>
      (function () {
        var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwUQQ4XtYyajt6VFcldRTzCmU3PcFlVtQUdBQoJR3SafewHXyZ0XKkaFlk7HZsDia929Q/exec';
        var iframe = document.getElementById('portal-frame');
        var wrapperUrl = new URL(window.location.href);
        var appUrl = new URL(EXEC_URL);

        if (!iframe) return;

        if (wrapperUrl.search) {
          appUrl.search = wrapperUrl.search;
        }

        iframe.src = appUrl.toString();

        if (wrapperUrl.searchParams.has('login_token')) {
          wrapperUrl.searchParams.delete('login_token');
          var nextUrl =
            wrapperUrl.pathname +
            (wrapperUrl.search ? wrapperUrl.search : '') +
            (wrapperUrl.hash ? wrapperUrl.hash : '');
          window.history.replaceState(null, '', nextUrl);
        }
      })();
    </script>
  </body>
</html>
