<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Дисциплина v2 | Личный кабинет</title>
    <meta
      name="description"
      content="Личный кабинет рекрутера NaimTech — вход через Google."
    >
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
    <link rel="shortcut icon" type="image/png" href="./favicon-32.png">
    <style>
      :root {
        --color-bg: #f4f6fa;
        --color-card: #ffffff;
        --color-border: #e2e8f0;
        --color-border-soft: #eff1f5;
        --color-text: #0f172a;
        --color-text-muted: #64748b;
        --color-primary: #2563eb;
        --color-primary-strong: #1d4ed8;
        --color-header-from: #1d60d1;
        --color-header-to: #0036ac;
        --color-panel: rgba(15, 23, 42, 0.82);
        --color-line: rgba(148, 163, 184, 0.22);
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        min-height: 100%;
        background: var(--color-bg);
        color: var(--color-text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      body { min-width: 320px; }

      /* ── Layout ────────────────────────────────────────────────── */
      .layout {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: 1fr auto;
      }
      .hero {
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }
      .footer {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 16px;
        background: var(--color-panel);
        border-top: 1px solid var(--color-line);
        backdrop-filter: blur(10px);
      }
      .footer a {
        font-size: 13px;
        text-decoration: none;
        color: #bfdbfe;
        white-space: nowrap;
      }

      /* ── Full-screen cabinet iframe ───────────────────────────── */
      .cabinet-shell {
        position: fixed;
        inset: 0;
        background: var(--color-bg);
        z-index: 50;
      }
      .cabinet-shell iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
      body.is-cabinet-active .layout { display: none; }

      /* ── Auth screens (синхронизировано с PWA) ──────────────── */
      .auth-screen {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 20px calc(32px + env(safe-area-inset-bottom, 0px));
        background:
          radial-gradient(ellipse at top, rgba(29, 96, 209, 0.08) 0%, transparent 60%),
          radial-gradient(ellipse at bottom, rgba(4, 78, 198, 0.05) 0%, transparent 55%),
          var(--color-bg);
        box-sizing: border-box;
      }
      .auth-card {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px 28px;
        background: #fff;
        border-radius: 22px;
        border: 1px solid var(--color-border-soft);
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.04),
          0 12px 40px rgba(15, 23, 42, 0.08);
        text-align: center;
        animation: authCardEnter .4s cubic-bezier(.4, 0, .2, 1) both;
      }
      @keyframes authCardEnter {
        from { opacity: 0; transform: translateY(8px) scale(.985); }
        to   { opacity: 1; transform: translateY(0)   scale(1);    }
      }
      .auth-logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 18px;
        display: block;
        background: linear-gradient(135deg, var(--color-header-from) 0%, var(--color-header-to) 100%);
        color: #fff;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: .02em;
        line-height: 72px;
        text-align: center;
        box-shadow:
          0 4px 14px rgba(4, 78, 198, 0.25),
          0 1px 3px rgba(15, 23, 42, 0.08);
      }
      .auth-title {
        margin: 0 0 8px;
        color: var(--color-text);
        font-size: 22px;
        line-height: 28px;
        font-weight: 800;
        letter-spacing: -0.4px;
      }
      .auth-subtitle {
        margin: 0 0 22px;
        color: var(--color-text-muted);
        font-size: 15px;
        line-height: 22px;
        font-weight: 500;
        letter-spacing: -0.1px;
      }
      .auth-status {
        margin: 14px 0 0;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(254, 226, 226, 0.55);
        border: 1px solid rgba(220, 38, 38, 0.16);
        color: #991b1b;
        font-size: 13px;
        line-height: 19px;
        font-weight: 500;
        text-align: left;
      }
      .auth-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        margin-top: 4px;
      }
      .auth-actions > div { display: flex; justify-content: center; }
      .auth-secondary-button {
        appearance: none;
        border: 1px solid var(--color-border);
        background: #fff;
        color: var(--color-text);
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 14px;
        line-height: 20px;
        font-weight: 600;
        letter-spacing: -0.1px;
        cursor: pointer;
        min-width: 180px;
        transition: background-color .18s ease, border-color .18s ease, transform .15s ease;
        font-family: inherit;
      }
      .auth-secondary-button:hover {
        background: rgba(4, 78, 198, 0.04);
        border-color: rgba(4, 78, 198, 0.25);
      }
      .auth-secondary-button:active { transform: scale(0.98); }
      .auth-footer {
        margin-top: 28px;
        color: rgba(15, 23, 42, 0.45);
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        letter-spacing: 0.1px;
        text-align: center;
      }
      .auth-spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 18px;
        border-radius: 50%;
        border: 3px solid rgba(4, 78, 198, 0.15);
        border-top-color: var(--color-primary);
        animation: authSpin 0.9s linear infinite;
      }
      @keyframes authSpin { to { transform: rotate(360deg); } }
      .auth-loading-card { padding-top: 28px; }
      .auth-loading-hint {
        margin-top: 14px;
        color: rgba(15, 23, 42, 0.5);
        font-size: 13px;
        line-height: 18px;
        font-weight: 500;
        font-style: italic;
      }
      @media (prefers-reduced-motion: reduce) {
        .auth-card { animation: none; }
        .auth-spinner { animation: authSpin 1.8s linear infinite; }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <main class="hero" id="wrapper-root">
        <div class="auth-screen">
          <div class="auth-card auth-loading-card">
            <div class="auth-spinner" aria-hidden="true"></div>
            <h1 class="auth-title">Открываем кабинет</h1>
            <p class="auth-loading-hint">Минутку — проверяем вашу учётную запись…</p>
          </div>
        </div>
      </main>

      <footer class="footer">
        <a href="guide.html">Инструкция</a>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms-of-service.html">Terms of Service</a>
      </footer>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function () {
        'use strict';

        var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwUQQ4XtYyajt6VFcldRTzCmU3PcFlVtQUdBQoJR3SafewHXyZ0XKkaFlk7HZsDia929Q/exec';
        var OAUTH_CLIENT_ID = '435134581493-qkqpf78e7oh4e7th1e1rpd7qe9hpv7f3.apps.googleusercontent.com';
        // Срок хранения токена в localStorage. Google ID-токен сам по себе
        // живёт ~1 час; используем 50 минут с запасом — иначе сервер вернёт
        // auth_unavailable, и кабинет придёт обратно к нам за свежим токеном.
        var TOKEN_TTL_MS = 50 * 60 * 1000;
        var GIS_LOAD_TIMEOUT_MS = 8000;

        var TOKEN_KEY = 'naimtech_cabinet_id_token_v1';
        var TOKEN_TS_KEY = 'naimtech_cabinet_id_token_ts_v1';
        var TOKEN_EMAIL_KEY = 'naimtech_cabinet_id_token_email_v1';

        var wrapperRoot = document.getElementById('wrapper-root');
        var state = { gisInitDone: false, didAutoPrompt: false };

        bootstrap();

        function bootstrap() {
          var search = new URLSearchParams(window.location.search);

          // ?logout=1 — пришли из кабинета с просьбой переключить аккаунт.
          if (search.get('logout') === '1') {
            clearCachedToken();
            stripQueryParam('logout');
            waitForGoogleSignIn(function (ok) {
              if (ok) {
                initGoogleSignIn();
                try { google.accounts.id.disableAutoSelect(); } catch (e) {}
              }
              renderLoginScreen('');
            });
            return;
          }

          // Если в кэше есть свежий токен — сразу грузим кабинет.
          var cached = readCachedToken();
          if (cached.token) {
            mountCabinetIframe(cached.token);
            return;
          }

          waitForGoogleSignIn(function (ok) {
            if (!ok) {
              renderLoginScreen('Не удалось загрузить Google Sign-In. Проверьте подключение и обновите страницу.');
              return;
            }
            initGoogleSignIn();
            renderLoginScreen('');
            if (!state.didAutoPrompt) {
              state.didAutoPrompt = true;
              try { google.accounts.id.prompt(); } catch (e) {}
            }
          });
        }

        // ---------- Google Identity Services ----------

        function waitForGoogleSignIn(done) {
          var started = Date.now();
          (function tick() {
            if (window.google && google.accounts && google.accounts.id && typeof google.accounts.id.initialize === 'function') {
              done(true);
              return;
            }
            if (Date.now() - started > GIS_LOAD_TIMEOUT_MS) {
              done(false);
              return;
            }
            setTimeout(tick, 100);
          })();
        }

        function initGoogleSignIn() {
          if (state.gisInitDone) return;
          try {
            google.accounts.id.initialize({
              client_id: OAUTH_CLIENT_ID,
              callback: handleCredentialResponse,
              auto_select: true,
              ux_mode: 'popup',
              context: 'signin',
              itp_support: true,
            });
            state.gisInitDone = true;
          } catch (err) {
            renderLoginScreen('Ошибка инициализации Google Sign-In: ' + (err && err.message ? err.message : err));
          }
        }

        function handleCredentialResponse(response) {
          var idToken = response && response.credential ? String(response.credential) : '';
          if (!idToken) {
            renderLoginScreen('Не удалось получить Google ID-токен. Попробуйте ещё раз.');
            return;
          }
          var email = extractEmailFromIdToken(idToken);
          persistCachedToken(idToken, email);
          mountCabinetIframe(idToken);
        }

        // ---------- Cabinet iframe ----------

        function mountCabinetIframe(idToken) {
          document.body.classList.add('is-cabinet-active');
          var existing = document.getElementById('cabinet-shell');
          if (existing) existing.remove();

          var shell = document.createElement('div');
          shell.id = 'cabinet-shell';
          shell.className = 'cabinet-shell';

          var iframe = document.createElement('iframe');
          iframe.src = EXEC_URL + (EXEC_URL.indexOf('?') >= 0 ? '&' : '?') +
            'login_token=' + encodeURIComponent(idToken);
          iframe.setAttribute('title', 'Личный кабинет NaimTech');
          iframe.setAttribute('referrerpolicy', 'no-referrer');
          iframe.setAttribute('allow', 'clipboard-write');

          shell.appendChild(iframe);
          document.body.appendChild(shell);
        }

        // ---------- Login screen UI ----------

        function renderLoginScreen(statusMessage) {
          document.body.classList.remove('is-cabinet-active');
          var shell = document.getElementById('cabinet-shell');
          if (shell) shell.remove();

          wrapperRoot.innerHTML =
            '<div class="auth-screen">' +
              '<div class="auth-card">' +
                '<div class="auth-logo" aria-hidden="true">NT</div>' +
                '<h1 class="auth-title">Вход в Личный Кабинет NaimTech</h1>' +
                '<p class="auth-subtitle">Войдите через Google, чтобы открыть кабинет.</p>' +
                '<div class="auth-actions">' +
                  '<div id="gis-button-host"></div>' +
                '</div>' +
                (statusMessage ? '<div class="auth-status">' + escapeHtml(statusMessage) + '</div>' : '') +
              '</div>' +
              '<div class="auth-footer">NaimTech &middot; Личный кабинет</div>' +
            '</div>';

          var host = document.getElementById('gis-button-host');
          if (!host) return;
          if (!(window.google && google.accounts && google.accounts.id && typeof google.accounts.id.renderButton === 'function')) {
            host.innerHTML = '<p style="color:#64748b;margin:0;">Загружаем Google Sign-In…</p>';
            return;
          }

          try {
            google.accounts.id.renderButton(host, {
              type: 'standard',
              theme: 'filled_blue',
              size: 'large',
              text: 'signin_with',
              shape: 'pill',
              logo_alignment: 'left',
              locale: 'ru',
            });
          } catch (e) {
            host.innerHTML = '<p style="color:#b91c1c;margin:0;">Не удалось показать кнопку входа.</p>';
          }
        }

        // ---------- Token cache (localStorage) ----------

        function persistCachedToken(token, email) {
          try { localStorage.setItem(TOKEN_KEY, String(token || '')); } catch (e) {}
          try { localStorage.setItem(TOKEN_TS_KEY, String(Date.now())); } catch (e) {}
          try { localStorage.setItem(TOKEN_EMAIL_KEY, String(email || '')); } catch (e) {}
        }

        function readCachedToken() {
          var token = '';
          var ts = 0;
          var email = '';
          try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
          try { ts = Number(localStorage.getItem(TOKEN_TS_KEY) || 0); } catch (e) {}
          try { email = localStorage.getItem(TOKEN_EMAIL_KEY) || ''; } catch (e) {}
          if (!token || !ts || (Date.now() - ts) > TOKEN_TTL_MS) {
            return { token: '', ts: 0, email: '' };
          }
          return { token: token, ts: ts, email: email };
        }

        function clearCachedToken() {
          try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
          try { localStorage.removeItem(TOKEN_TS_KEY); } catch (e) {}
          try { localStorage.removeItem(TOKEN_EMAIL_KEY); } catch (e) {}
        }

        // ---------- Helpers ----------

        function extractEmailFromIdToken(jwt) {
          try {
            var parts = String(jwt || '').split('.');
            if (parts.length < 2) return '';
            var payload = parts[1].replace(/-/g, '+').replace(/_/g, '/');
            var pad = payload.length % 4;
            if (pad) payload += new Array(5 - pad).join('=');
            var json = atob(payload);
            var data = JSON.parse(decodeURIComponent(json.split('').map(function (c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join('')));
            return String(data.email || '').toLowerCase();
          } catch (e) {
            return '';
          }
        }

        function stripQueryParam(name) {
          try {
            var url = new URL(window.location.href);
            url.searchParams.delete(name);
            var next = url.pathname + (url.search ? url.search : '') + (url.hash ? url.hash : '');
            window.history.replaceState(null, '', next);
          } catch (e) {}
        }

        function escapeHtml(value) {
          return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }
      })();
    </script>
  </body>
</html>
