<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Дисциплина v2 | Инструкция</title>
    <meta
      name="description"
      content="Доменная страница инструкции для кабинета Дисциплина v2."
    >
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
    <link rel="shortcut icon" type="image/png" href="./favicon-32.png">
    <style>
      :root {
        --bg: #0b1120;
        --panel: rgba(15, 23, 42, 0.82);
        --line: rgba(148, 163, 184, 0.22);
        --text: #e5eef8;
        --card: #ffffff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 Arial, sans-serif;
      }

      .layout {
        min-height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto;
      }

      .hero {
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .card {
        width: min(560px, 100%);
        background: var(--card);
        color: #0f172a;
        border-radius: 18px;
        padding: 28px 24px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.28);
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #2563eb;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 14px;
      }

      .muted {
        color: #475569;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 12px;
        border: 1px solid transparent;
        text-decoration: none;
        font-weight: 700;
      }

      .btn-primary {
        background: #2563eb;
        color: #ffffff;
      }

      .btn-secondary {
        background: #ffffff;
        color: #2563eb;
        border-color: #bfdbfe;
      }

      .footer {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        backdrop-filter: blur(10px);
      }

      .footer a {
        font-size: 13px;
        text-decoration: none;
        color: #bfdbfe;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <main class="hero">
        <section class="card">
          <div class="eyebrow">NaimTech</div>
          <h1>Переходим к инструкции</h1>
          <p>
            Инструкция открывается напрямую в Google Apps Script, чтобы избежать
            проблем со входом на мобильных устройствах.
          </p>
          <p class="muted" id="status-text">
            Если переход не произошел автоматически, откройте инструкцию вручную.
          </p>

          <div class="actions">
            <a class="btn btn-primary" id="open-guide-link" href="#">Открыть инструкцию</a>
            <a class="btn btn-secondary" href="./">Кабинет</a>
          </div>
        </section>
      </main>

      <footer class="footer">
        <a href="./">Кабинет</a>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms-of-service.html">Terms of Service</a>
      </footer>
    </div>

    <script>
      (function () {
        var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwUQQ4XtYyajt6VFcldRTzCmU3PcFlVtQUdBQoJR3SafewHXyZ0XKkaFlk7HZsDia929Q/exec?page=guide';
        var openGuideLink = document.getElementById('open-guide-link');
        var statusText = document.getElementById('status-text');
        if (openGuideLink) {
          openGuideLink.href = EXEC_URL;
        }
        if (statusText) {
          statusText.textContent = 'Выполняем безопасный переход к инструкции...';
        }
        window.location.replace(EXEC_URL);
      })();
    </script>
  </body>
</html>
